<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Favicon. Versão simplificada do IconeMarca de components/icones.tsx:
    o círculo dividido pela fresta diagonal — documento (fato) na
    metade escura, urna (voto) na metade cinza.

    Simplificada de propósito: a 16px as linhas do documento e os
    botões da urna viram borrão, então aqui ficam só as duas formas
    brancas e a fresta.
  -->
  <defs>
    <clipPath id="c">
      <circle cx="16" cy="16" r="15" />
    </clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="32" height="32" fill="#191713" />
    <path d="M5 34 L31 -2 L34 -2 L34 34 Z" fill="#6d675e" />
    <path d="M5 34 L31 -2" stroke="#ffffff" stroke-width="2.6" fill="none" />
    <rect x="8.5" y="5" width="9" height="12" rx="1.6" fill="#ffffff" />
    <rect x="15.5" y="19" width="11" height="7.5" rx="1.4" fill="#ffffff" />
    <rect x="17" y="20.8" width="3.6" height="3" rx="0.7" fill="#191713" />
    <rect x="22" y="20.8" width="3" height="3" rx="0.7" fill="#191713" />
  </g>
</svg>
