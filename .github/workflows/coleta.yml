name: Coleta diária

# Por que diária: em período eleitoral a situação do registro muda de um
# dia para o outro. Na coleta de 28/08/2026, 232 das 575 candidaturas
# ainda estavam em julgamento — uma pode ser indeferida hoje e o site
# mostraria "Deferido" até alguém lembrar de rodar o comando na mão.
on:
  schedule:
    # 09:17 UTC = 06:17 em Brasília. O cron do GitHub é sempre em UTC e
    # não conhece horário de verão; se o Brasil voltar a adotá-lo, este
    # número precisa mudar.
    #
    # O minuto quebrado é de propósito. O agendamento do GitHub não é
    # garantido: sob carga ele atrasa e chega a pular execuções, e a
    # fila é pior na hora cheia, onde quase todo mundo agenda. Às :17 a
    # coleta compete com muito menos gente.
    - cron: "17 9 * * *"
  # Permite disparar na mão pela aba Actions, sem esperar o horário.
  workflow_dispatch:

# Nada por padrão. Só o job que precisa declara o que precisa.
permissions: {}

concurrency:
  # Duas coletas simultâneas brigariam pelo mesmo commit.
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Escrita só aqui: é este job que comita a coleta de volta no repo.
    permissions:
      contents: write

    steps:
      # v5: as v4 rodam em Node 20, descontinuado nos runners.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: este job tem `contents: write` e commita
      # sozinho. Sem a trava, um postinstall de qualquer dependência
      # (ou de dependência de dependência) roda com esse direito. A
      # coleta só executa scripts do próprio repositório, então não há
      # o que perder ao bloquear.
      - run: npm ci --ignore-scripts

      # As cinco coletas são independentes. `if: always()` faz o Senado
      # rodar mesmo se o TSE cair — meia atualização é melhor que
      # nenhuma, e o passo que falhou aparece vermelho no resumo.
      - name: TSE — candidaturas
        run: npm run coleta:tse

      - name: Câmara — bancada federal
        if: always()
        run: npm run coleta:camara

      - name: Senado — bancada
        if: always()
        run: npm run coleta:senado

      # Entrou depois das outras três e ficou de fora do agendamento por
      # um dia: em 30/08/2026 as votações eram de 28/08 enquanto o resto
      # era do dia. A ficha diz "as votações mais recentes", então dado
      # parado aqui não fica desatualizado em silêncio — fica mentindo.
      - name: Câmara e Senado — votações nominais
        if: always()
        run: npm run coleta:votacoes

      # A ÚNICA coleta com credencial. O token sai do secret do
      # repositório e entra só no ambiente deste passo — não no do
      # build, que é onde um segredo vazaria para dentro de `.next/`.
      #
      # Sem o secret configurado, o passo falha com mensagem clara e as
      # outras quatro coletas seguem: `data/es/emendas.json` fica com o
      # conteúdo do dia anterior, e o site mostra a data antiga na
      # procedência em vez de mostrar um vazio novo.
      - name: Portal da Transparência — emendas parlamentares
        if: always()
        env:
          TRANSPARENCIA_TOKEN: ${{ secrets.TRANSPARENCIA_TOKEN }}
        run: npm run coleta:transparencia

      # Verifica que o site ainda compila com o dado novo. Se uma fonte
      # mudar de formato e quebrar a build, é melhor descobrir aqui do
      # que em produção — o commit não acontece.
      # Sem `env` de propósito: o token NÃO entra no ambiente do build.
      # É a separação que a arquitetura promete — o site nunca vê a
      # credencial porque ela não existe no processo que o constrói.
      # Ver docs/segredos-e-credenciais.md.
      - name: Conferir que o site compila
        id: build
        if: always()
        run: npm run build

      # `always()` sozinho aqui anulava a trava do build: o passo rodava
      # mesmo com a compilação quebrada, que é exatamente o caso que ele
      # deveria barrar. Precisa dos dois: `always()` para sobreviver a
      # uma coleta que falhou (meia atualização ainda vale), e o teste
      # explícito de `steps.build` para desistir quando o site não
      # compila com o dado novo.
      - name: Commitar a coleta
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "coleta automática"
          git config user.email "actions@github.com"

          # PRIMEIRO alinhar com o `main` mais novo, DEPOIS commitar.
          #
          # Era o contrário — commitava e depois `git pull --rebase` —, e
          # em 02/09/2026 isso perdeu uma coleta inteira. O `main` tinha
          # andado dois commits durante o job, o rebase encontrou os
          # mesmos JSONs mudados dos dois lados e parou em CONFLICT nos
          # três arquivos. A coleta foi feita e jogada fora.
          #
          # Rebase é a ferramenta errada aqui. O conteúdo de `data/es` é
          # DERIVADO: ele é regenerado inteiro a cada coleta, e não há o
          # que fundir entre a versão nova e a antiga — a nova é a
          # resposta atual das fontes, ponto. Movendo o HEAD para o
          # `main` mais novo ANTES de commitar, o que a coleta acabou de
          # escrever vira a mudança em cima da base mais nova, e conflito
          # deixa de ser possível.
          #
          # `--mixed` preserva a árvore de trabalho, que é justamente
          # onde a coleta escreveu. Arquivo que mudou no `main` e não é
          # de coleta fica sujo na árvore e não entra no commit, porque
          # só `data/es` é adicionado abaixo.
          git fetch origin main
          git reset --mixed FETCH_HEAD

          # `dados-brutos/` está no .gitignore: só o normalizado entra.
          #
          # `--ignore-removal` porque a coleta só ESCREVE arquivo, nunca
          # apaga. Sem a trava, um arquivo que exista no `main` novo e
          # não na árvore deste job — porque alguém acabou de acrescentar
          # um — entraria no commit como remoção, e a coleta apagaria em
          # silêncio um dado que ninguém pediu para apagar.
          git add --ignore-removal data/es

          # Rede de segurança: se as coletas falharem e nada for escrito,
          # não há o que commitar.
          if git diff --cached --quiet; then
            echo "Nada foi escrito. Provavelmente todas as coletas falharam."
            exit 0
          fi

          # O commit acontece TODO DIA, e isso é proposital: cada coleta
          # grava `coletadoEm`, e a tarja do site mostra essa data. Se não
          # commitássemos, a data envelheceria e o site mentiria sobre o
          # próprio frescor.
          #
          # Mas o histórico precisa distinguir "só o carimbo mudou" de
          # "candidatura foi indeferida". Daí a contagem abaixo, que
          # ignora a linha de `coletadoEm` e vê se sobrou outra mudança.
          #
          # `grep -c` em vez de `head -1`: o `head` fechava o cano antes
          # do `grep` terminar de escrever, e o log ganhava um
          # "grep: write error: Broken pipe" que parecia defeito e não
          # era. O `|| true` existe porque `grep` sai com 1 quando não
          # acha nada, e "não achou nada" aqui é resposta válida.
          MUDANCAS=$(git diff --cached -U0 -- data/es \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -cv '"coletadoEm"' || true)

          DATA=$(date -u +%Y-%m-%d)
          if [ "$MUDANCAS" -eq 0 ]; then
            git commit -m "dados: coleta de $DATA (sem mudança de conteúdo)"
          else
            git commit -m "dados: coleta de $DATA"
          fi

          # O push é fast-forward por construção: o commit foi feito em
          # cima do `main` que acabamos de buscar. Se ainda assim for
          # recusado, alguém empurrou nos segundos entre o fetch e o
          # push — e aí falhar é o certo, não insistir por cima.
          git push origin HEAD:main
