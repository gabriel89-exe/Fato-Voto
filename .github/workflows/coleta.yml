name: Coleta diária

# Por que diária: em período eleitoral a situação do registro muda de um
# dia para o outro. Na coleta de 28/08/2026, 232 das 575 candidaturas
# ainda estavam em julgamento — uma pode ser indeferida hoje e o site
# mostraria "Deferido" até alguém lembrar de rodar o comando na mão.
on:
  schedule:
    # 09:17 UTC = 06:17 em Brasília. O cron do GitHub é sempre em UTC e
    # não conhece horário de verão; se o Brasil voltar a adotá-lo, este
    # número precisa mudar.
    #
    # O minuto quebrado é de propósito. O agendamento do GitHub não é
    # garantido: sob carga ele atrasa e chega a pular execuções, e a
    # fila é pior na hora cheia, onde quase todo mundo agenda. Às :17 a
    # coleta compete com muito menos gente.
    - cron: "17 9 * * *"
  # Permite disparar na mão pela aba Actions, sem esperar o horário.
  workflow_dispatch:

# O job comita de volta no repositório, então precisa de escrita.
permissions:
  contents: write

concurrency:
  # Duas coletas simultâneas brigariam pelo mesmo commit.
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # v5: as v4 rodam em Node 20, descontinuado nos runners.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # --ignore-scripts: este job tem `contents: write` e commita
      # sozinho. Sem a trava, um postinstall de qualquer dependência
      # (ou de dependência de dependência) roda com esse direito. A
      # coleta só executa scripts do próprio repositório, então não há
      # o que perder ao bloquear.
      - run: npm ci --ignore-scripts

      # As três coletas são independentes. `if: always()` faz o Senado
      # rodar mesmo se o TSE cair — meia atualização é melhor que
      # nenhuma, e o passo que falhou aparece vermelho no resumo.
      - name: TSE — candidaturas
        run: npm run coleta:tse

      - name: Câmara — bancada federal
        if: always()
        run: npm run coleta:camara

      - name: Senado — bancada
        if: always()
        run: npm run coleta:senado

      # Verifica que o site ainda compila com o dado novo. Se uma fonte
      # mudar de formato e quebrar a build, é melhor descobrir aqui do
      # que em produção — o commit não acontece.
      - name: Conferir que o site compila
        id: build
        if: always()
        run: npm run build

      # `always()` sozinho aqui anulava a trava do build: o passo rodava
      # mesmo com a compilação quebrada, que é exatamente o caso que ele
      # deveria barrar. Precisa dos dois: `always()` para sobreviver a
      # uma coleta que falhou (meia atualização ainda vale), e o teste
      # explícito de `steps.build` para desistir quando o site não
      # compila com o dado novo.
      - name: Commitar a coleta
        if: always() && steps.build.outcome == 'success'
        run: |
          git config user.name "coleta automática"
          git config user.email "actions@github.com"

          # `dados-brutos/` está no .gitignore: só o normalizado entra.
          git add data/es

          # Rede de segurança: se as três coletas falharem e nada for
          # escrito, não há o que commitar.
          if git diff --cached --quiet; then
            echo "Nada foi escrito. Provavelmente todas as coletas falharam."
            exit 0
          fi

          # O commit acontece TODO DIA, e isso é proposital: cada coleta
          # grava `coletadoEm`, e a tarja do site mostra essa data. Se não
          # commitássemos, a data envelheceria e o site mentiria sobre o
          # próprio frescor.
          #
          # Mas o histórico precisa distinguir "só o carimbo mudou" de
          # "candidatura foi indeferida". Daí o diff abaixo, que ignora a
          # linha de `coletadoEm` e olha se sobrou alguma outra mudança.
          CONTEUDO=$(git diff --cached -U0 -- data/es \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -v '"coletadoEm"' \
            | head -1)

          DATA=$(date -u +%Y-%m-%d)
          if [ -z "$CONTEUDO" ]; then
            git commit -m "dados: coleta de $DATA (sem mudança de conteúdo)"
          else
            git commit -m "dados: coleta de $DATA"
          fi

          # Alguém pode ter empurrado no `main` durante os minutos que a
          # coleta levou. Sem o rebase, o push é recusado por
          # não-fast-forward e a coleta do dia se perde por um motivo que
          # nada tem a ver com os dados.
          git pull --rebase origin main
          git push
